[project]
name = "unipivot-api"
version = "0.4.0"
description = "UNIPIVOT 학내 정보 에이전트 API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.14",  # 2.14 아래는 AliasChoices(설정 이름 두 개)의 우선순위가 틀린다
  "psycopg[binary,pool]>=3.2",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "google-genai>=2.29",
  "pypdf>=6",
  "olefile>=0.47",
  "beautifulsoup4>=4.12",
  "python-multipart>=0.0.32",
  # 바깥 호출(LearningX·Google·Supabase Storage·온통청년·웹 푸시)에 쓴다. 지금까지는
  # google-genai가 끌어오는 것에 얹혀 있었다 — 앱이 직접 import하는 패키지는 직접 적는다
  "httpx>=0.27",
  "http-ece>=1.2.1",  # 웹 푸시 본문 암호화(F-33, RFC 8291)
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.22", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: Postgres가 필요한 통합 테스트 (DATABASE_URL이 없으면 건너뜀)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 한국어 문구·주석 길이는 ruff format에 맡긴다
