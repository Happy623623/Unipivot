name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCKS: "true"

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: 마이그레이션 적용 (auth 흉내 → supabase/migrations 이름 순)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/ci/auth_stub.sql
          for f in supabase/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: 스키마 점검 (RLS·FK 인덱스)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/ci/schema_checks.sql
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: api
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: api
      - run: uv run pytest
        working-directory: api
